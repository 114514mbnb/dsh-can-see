# Vision Provider 配置示例

# 提供商选择: openai, anthropic, google, openrouter, custom
provider: openai

# 模型名称（可选，默认使用各提供商的默认视觉模型）
model: gpt-4o

# API Key（支持环境变量）
api_key: ${OPENAI_API_KEY}

# 生成参数
max_tokens: 1000
temperature: 0.7

# 自定义 API 端点（可选）
# base_url: https://api.example.com/v1

# 批量处理配置
batch:
  max_concurrent: 5
  timeout: 60

---
# Anthropic 配置示例
provider: anthropic
model: claude-3-5-sonnet-20241022
api_key: ${ANTHROPIC_API_KEY}
max_tokens: 1000
temperature: 0.7

---
# Google Gemini 配置示例
provider: google
model: gemini-2.0-flash-exp
api_key: ${GOOGLE_API_KEY}
max_tokens: 1000
temperature: 0.7

---
# OpenRouter 配置示例
provider: openrouter
model: openai/gpt-4o
api_key: ${OPENROUTER_API_KEY}
max_tokens: 1000
temperature: 0.7

---
# 自定义 API 配置示例（兼容 OpenAI 格式）
provider: custom
model: custom-vision-model
api_key: ${CUSTOM_API_KEY}
base_url: https://your-custom-api.com/v1
max_tokens: 1000
temperature: 0.7
